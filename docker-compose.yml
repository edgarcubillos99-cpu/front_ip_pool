services:
  frontend:
    build: .
    image: ip-pool-front:latest
    container_name: ip-pool-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:80"
    environment:
      # URL pública del backend Go tal como la ve el NAVEGADOR del usuario
      # (no la red interna de Docker). Debe estar en CORS_ALLOWED_ORIGINS del backend.
      API_URL: ${API_URL:-http://localhost:8082}
